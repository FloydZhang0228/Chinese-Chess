name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VER: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux,   os: ubuntu-22.04 }   # 22.04: 较低 glibc, 兼容更多发行版
          - { platform: windows, os: windows-latest }
          - { platform: macos,   os: macos-latest }
          - { platform: android, os: ubuntu-22.04 }
          - { platform: ios,     os: macos-latest }
          - { platform: web,     os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # 与本地完全相同的入口: 产物在 build/<平台>/
      - run: scripts/build.sh ${{ matrix.platform }} "$VER"

      # 目标: 用户下载后"解压/双击即是真实产物", 不出现 zip 套 zip。
      # - 单文件产物(AppImage / windows zip / dmg / apk / ipa): archive:false, 上传文件本身
      # - web: 上传站点文件夹, 页面下载到的 zip 解压后就是 index.html 等站点文件
      - name: Locate artifact file
        if: matrix.platform != 'web'
        id: art
        run: |
          # 用数组计数而不是 wc -l: macOS 的 wc 输出带前导空格, 字符串比较会误判
          files=(build/${{ matrix.platform }}/Chinese-Chess-*)
          [ "${#files[@]}" -eq 1 ] && [ -f "${files[0]}" ] || { echo "应恰有 1 个产物, 实际: ${files[*]}" >&2; exit 1; }
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (file)
        if: matrix.platform != 'web'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.art.outputs.file }}
          archive: false
          if-no-files-found: error

      - name: Stage web site
        if: matrix.platform == 'web'
        run: |
          mkdir -p site-out
          cp -r build/web/. site-out/
          rm -f site-out/Chinese-Chess-*.zip

      - name: Upload artifact (web site)
        if: matrix.platform == 'web'
        uses: actions/upload-artifact@v7
        with:
          name: web-site
          path: site-out/
          if-no-files-found: error

  release:
    # 推送 master 或 v* 标签都发布; PR 只构建不发布
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # 单文件产物: 每个是独立 artifact(以文件名命名), 合并下载到 dist/。
      # skip-decompress 必须开: windows 的产物本身就是 .zip, 不开会被自动解压成一堆 dll/exe,
      # Release 里就没有 windows 压缩包了。
      - uses: actions/download-artifact@v8
        with:
          pattern: Chinese-Chess-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      # web: 下载站点文件夹, 重新打成 zip(Release 只能挂文件, 不能挂文件夹)
      - uses: actions/download-artifact@v8
        with:
          name: web-site
          path: site
      - name: Zip web site
        run: |
          mkdir -p dist
          (cd site && zip -qr "../dist/Chinese-Chess-$VER-web.zip" .)

      # 校验: 六个平台产物齐全, 且 dist/ 里只有这六个文件(没有被误解压出的散件)
      - name: Verify artifacts
        run: |
          ls -lh dist
          for pat in '*-linux-x86_64.AppImage' '*-windows-x64.zip' '*-macos-universal.dmg' '*-android.apk' '*-ios-unsigned.ipa' '*-web.zip'; do
            ls dist/$pat >/dev/null 2>&1 || { echo "缺少产物: $pat" >&2; exit 1; }
          done
          n=$(find dist -mindepth 1 | wc -l | tr -d ' ')
          [ "$n" -eq 6 ] || { echo "dist/ 应恰有 6 个文件, 实际 $n 个(可能有产物被误解压)" >&2; exit 1; }

      # 正式版: 推送 v* 标签 -> 以标签名创建 Release
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # 滚动版: 推送 master -> 更新固定的 "latest" 预发布, 产物覆盖为最新一次构建。
      # 文件名含 dev-<运行号>, 每次不同, 所以先删掉旧的 latest Release 和标签, 避免旧产物越积越多。
      - name: Remove previous rolling release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Rolling release (master)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建 (${{ github.sha }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            由 master 分支最新提交自动构建, 每次推送都会覆盖本 Release 的产物。
            提交: ${{ github.sha }}
            正式版本请看带版本号的 Release。
